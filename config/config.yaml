# ==========================================================
# CAMERA
# ==========================================================
CAMERA:
  IP: "192.168.0.238" # "192.168.0.238"
  PORT: 9876

# ==========================================================
# USB CAMERA
# Only USB camera is used for this application.
# ==========================================================
USB_CAMERA:
  IP: "192.168.0.79"
  PORT: 9876

# ==========================================================
# RACE-6D
# MODEL_CONFIG is relative to the APPLE_PICK project root.
# ==========================================================
RACE_6D:
  MODEL_PATH: "model/race6d_1027.pth" # 1006
  MODEL_CONFIG: "service/RACE_6D/config/race6d_r50vd_pose_rgbd.yml"
  SCORE_THRESHOLD: 0.25
  MAX_PER_CLASS: 1
  MAX_DETECTIONS: null
  CLASS_ID: null
  DEPTH_Z_MAX_MM: 2000.0
  INVALID_DEPTH_VALUE: 65535

  LABEL_NAMES:
    0: iphone14_plus_blue
    1: brown_box
    2: flap
    3: iphone14_pro_max
    4: ipad11_inch
    5: ipad13_inch
    6: watch_hermes
    7: watch
    8: watch_gray
    9: watch_white

# =======================================================
# BOX CH
# ==========================================================
BOX_CHECK:
  ENABLED: true
  SIM_THRESHOLD: 0.85
  COVERAGE_THRESHOLD: 0.15

# ==========================================================
# ALIGNMENT
# ROI size of the target, in METERS (same unit as the pose sent
# to /alignment/predict). The rectangle lies in the object's XY
# plane: WIDTH along X, HEIGHT along Y, centered on the pose.
# It is projected into the USB camera image as the SAM2 prompt box.
# The returned delta is T_target @ inv(T_input), in the camera frame.
# ==========================================================
ALIGNMENT:
  ENABLED: true
  HEIGHT: 0.07    # TODO: replace with the measured size (m)
  WIDTH: 0.2    # TODO: replace with the measured size (m)
  ROI_SCALE: 1.0  # >1 enlarges the SAM2 prompt box

# ==========================================================
# RIPCORD CHECK
# ==========================================================
RIPCORD_CHECK:
  ENABLED: true
  SIM_THRESHOLD: 0.75
  COVERAGE_THRESHOLD: 0.4