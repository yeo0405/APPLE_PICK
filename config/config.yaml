# ==========================================================
# CAMERA
# ==========================================================
CAMERA:
  IP: "192.168.0.238" # "192.168.0.238"
  PORT: 9876

# ==========================================================
# USB CAMERA
# Only USB camera is used for this application.
# ==========================================================
USB_CAMERA:
  IP: "192.168.0.79"
  PORT: 9876

# ==========================================================
# RACE-6D
# MODEL_CONFIG is relative to the APPLE_PICK project root.
# ==========================================================
RACE_6D:
  MODEL_PATH: "model/race6d_1102.pth" # 1006
  MODEL_CONFIG: "service/RACE_6D/config/race6d_r50vd_pose_rgbd.yml"
  SCORE_THRESHOLD: 0.5
  MAX_PER_CLASS: 1
  MAX_DETECTIONS: null
  CLASS_ID: null
  DEPTH_Z_MAX_MM: 2000.0
  INVALID_DEPTH_VALUE: 65535

  LABEL_NAMES:
    0: iphone14_plus_blue
    1: brown_box
    2: flap
    3: iphone14_pro_max
    4: ipad11_inch
    5: ipad13_inch
    6: watch_hermes
    7: watch
    8: watch_gray
    9: watch_white

# =======================================================
# BOX CH
# ==========================================================
BOX_CHECK:
  ENABLED: true
  SIM_THRESHOLD: 0.85
  COVERAGE_THRESHOLD: 0.15

# ==========================================================
# ALIGNMENT
# ROI size of the target, in METERS (same unit as the pose sent
# to /alignment/predict). The rectangle lies in the object's XY
# plane: WIDTH along X, HEIGHT along Y, centered on the pose.
# It is projected into the USB camera image as the SAM2 prompt box.
# The returned delta is T_target @ inv(T_input), in the camera frame.
# ==========================================================
ALIGNMENT:
  ENABLED: true
  HEIGHT: 0.07    # TODO: replace with the measured size (m)
  WIDTH: 0.2    # TODO: replace with the measured size (m)
  ROI_SCALE: 1.0  # >1 enlarges the SAM2 prompt box

# ==========================================================
# RIPCORD CHECK
# ==========================================================
RIPCORD_CHECK:
  ENABLED: true
  SIM_THRESHOLD: 0.75
  COVERAGE_THRESHOLD: 0.4

# ==========================================================
# RGB REFINE (top-face edge fitting + PnP post-processing)
# SIZE_M: real size of the cuboid in METERS, in the object frame (X, Y, Z).
# ORIGIN_OFFSET_M: position of the box geometric center expressed in the
#   model frame. [0,0,0] means the model origin is the box center.
#   If the BOP model origin is e.g. at the bottom face center, use [0,0,0.0145].
# The "top face" is automatically chosen as the +Z / -Z face visible to the camera.
# ==========================================================
RGB_REFINE:
  ENABLED: true
  LABELS:
    0:
      NAME: iphone14_plus_blue
      SIZE_M: {X: 0.178, Y: 0.0953, Z: 0.029}
      ORIGIN_OFFSET_M: [0.0, 0.0, 0.0]
      REF_IMAGE: "config/iphone14_plus_blue_top.png"   # relative to project root, or absolute
      REF_ROTATE_DEG: 0
      REF_FLIP_X: false
  PARAMS:
    BAND_PX: 30            # was 24: widen the search band so the real edge can be reached
    WEIGHT_RATIO: 3.0      # NEW: nearly flat weighting; the prior no longer pins edges to the prediction
    SAMPLES_PER_EDGE: 24
    EDGE_MARGIN: 0.12
    MIN_GRAD: 3.0          # was 4.0: slightly looser for low-contrast edges
    INLIER_PX: 1.5
    MIN_POINTS: 8
    MAX_REPROJ_PX: 2.0
    MAX_TRANS_MM: 40.0     # was 20.0: temporarily wider for diagnosis, otherwise a legitimate large correction gets rejected as trans_jump
    MAX_ROT_DEG: 20.0      # was 8.0
    MAX_EDGE_ANGLE_DEG: 8.0
    SIGMA_ROT_DEG: 10.0    # was 5.0: weaker prior, trust the image more
    SIGMA_TRANS_MM: 20.0   # was 10.0

  TEXTURE:
    ENABLED: true
    PARAMS:
      METHOD: sift
      PX_PER_MM: 1.5
      MARGIN_MM: 40.0
      # Feature Matching
      GATE_MM: 80.0
      RATIO: 0.90
      N_FEATURES: 4000
      SIFT_CONTRAST: 0.015
      # Preprocessing
      CLAHE: false
      SHARPEN: false
      # Homography
      H_THRESH_PX: 5.0
      # PnP
      PNP_THRESH_PX: 5.0
      # Relaxed matching requirements
      MIN_MATCHES: 6
      MIN_INLIERS: 6
      MIN_COVERAGE: 0.05
      # Relaxed validation
      MAX_REPROJ_PX: 4.0
      MAX_SCALE_DEV: 0.40
      MAX_TRANS_MM: 40.0
      MAX_ROT_DEG: 20.0
      # Face visibility
      MIN_FACE_COS: 0.25
      # PnP prior
      SIGMA_ROT_DEG: 20.0
      SIGMA_TRANS_MM: 50.0
      DEBUG_MATCHES: false
      DEBUG_ORIENTATION: false
      GRID_COLS: 4
      GRID_ROWS: 4
      MIN_GRID_CELLS: 3
      MIN_QUADRANTS: 2
      MIN_X_SPAN: 0.20
      MIN_Y_SPAN: 0.20