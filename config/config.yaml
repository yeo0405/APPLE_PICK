# ==========================================================
# CAMERA
# ==========================================================
CAMERA:
  IP: "192.168.0.238" # "192.168.0.238"
  PORT: 9876

# ==========================================================
# USB CAMERA
# Only USB camera is used for this application.
# ==========================================================
USB_CAMERA:
  IP: "192.168.0.79"
  PORT: 9876

# ==========================================================
# RACE-6D
# MODEL_CONFIG is relative to the APPLE_PICK project root.
# ==========================================================
RACE_6D:
  MODEL_PATH: "model/race6d_1102.pth" # 1006
  MODEL_CONFIG: "service/RACE_6D/config/race6d_r50vd_pose_rgbd.yml"
  SCORE_THRESHOLD: 0.5
  MAX_PER_CLASS: 1
  MAX_DETECTIONS: null
  CLASS_ID: null
  DEPTH_Z_MAX_MM: 2000.0
  INVALID_DEPTH_VALUE: 65535

  LABEL_NAMES:
    0: iphone14_plus_blue
    1: brown_box
    2: flap
    3: iphone14_pro_max
    4: ipad11_inch
    5: ipad13_inch
    6: watch_hermes
    7: watch
    8: watch_gray
    9: watch_white

# =======================================================
# BOX CH
# ==========================================================
BOX_CHECK:
  ENABLED: true
  SIM_THRESHOLD: 0.85
  COVERAGE_THRESHOLD: 0.15

# ==========================================================
# ALIGNMENT
# ROI size of the target, in METERS (same unit as the pose sent
# to /alignment/predict). The rectangle lies in the object's XY
# plane: WIDTH along X, HEIGHT along Y, centered on the pose.
# It is projected into the USB camera image as the SAM2 prompt box.
# The returned delta is T_target @ inv(T_input), in the camera frame.
# ==========================================================
ALIGNMENT:
  ENABLED: true
  HEIGHT: 0.07    # TODO: replace with the measured size (m)
  WIDTH: 0.2    # TODO: replace with the measured size (m)
  ROI_SCALE: 1.0  # >1 enlarges the SAM2 prompt box

# ==========================================================
# RIPCORD CHECK
# ==========================================================
RIPCORD_CHECK:
  ENABLED: true
  SIM_THRESHOLD: 0.75
  COVERAGE_THRESHOLD: 0.4

# ==========================================================
# RGB REFINE (top-face edge fitting + PnP post-processing)
# SIZE_M: real size of the cuboid in METERS, in the object frame (X, Y, Z).
# ORIGIN_OFFSET_M: position of the box geometric center expressed in the
#   model frame. [0,0,0] means the model origin is the box center.
#   If the BOP model origin is e.g. at the bottom face center, use [0,0,0.0145].
# The "top face" is automatically chosen as the +Z / -Z face visible to the camera.
# ==========================================================
RGB_REFINE:
  ENABLED: true
  LABELS:
    0:
      NAME: iphone14_plus_blue
      SIZE_M: {X: 0.178, Y: 0.0953, Z: 0.029}
      ORIGIN_OFFSET_M: [0.0, 0.0, 0.0]
      REF_IMAGE: "config/iphone14_plus_blue_top.png"   # relative to project root, or absolute
      REF_ROTATE_DEG: 0
      REF_FLIP_X: false
  PARAMS:
    BAND_PX: 20
    WEIGHT_RATIO: 2.0
    SAMPLES_PER_EDGE: 32
    EDGE_MARGIN: 0.1

    MIN_GRAD: 4.0
    GRAD_CAP: 20.0

    SEARCH_ANGLE_DEG: 4.0
    ANGLE_STEP_DEG: 0.5

    SUPPORT_PX: 2.0
    MIN_SUPPORT_FRAC: 0.6

    WALL_OUTER_RATIO: 0.75
    MIN_OUT_PX: 8.0

    MIN_VALID_EDGES: 3
    INLIER_PX: 1.5
    MIN_POINTS: 10
    MAX_EDGE_ANGLE_DEG: 5.0

    MAX_REPROJ_PX: 2.0
    MAX_TRANS_MM: 30.0
    MAX_ROT_DEG: 16.0

    AREA_RATIO_MIN: 0.8
    AREA_RATIO_MAX: 1.15
    MIN_FACE_COS: 0.2
    MIN_EDGE_LEN_PX: 20.0

    BLUR_KSIZE: 5
    SIGMA_ROT_DEG: 5.0
    SIGMA_TRANS_MM: 10.0

  # TEXTURE:
